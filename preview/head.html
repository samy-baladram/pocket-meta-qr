<base href="/"><meta name="robots" content="noindex, nofollow">
<script>/* A page in a folder (/preview/..., /ja/): <base href="/"> loads data and images from the site root; keep the page's
   own "#..." addresses (and "#..." link clicks) on its folder, not on the English page at "/". Phase 2 (Nov 24): PMQ_HOME
   (set by the build on a page with section addresses, "/ja/") = its folder: the page's "/events/" goes to "/ja/events/". */
(() => { const H = typeof PMQ_HOME === "string" && PMQ_HOME;
  const fix = (u) => typeof u !== "string" ? u : u.startsWith("#") ? location.pathname + location.search + u
    : H && u.startsWith("/") && !u.startsWith(H) ? H + u.slice(1) : u;
  for (const k of ["pushState", "replaceState"]) { const o = history[k].bind(history); history[k] = (s, t, u) => o(s, t, fix(u)); }
  /* Step 4: links the page builds itself (<a href="/decks/<id>/">) get the folder before the browser follows them */
  if (H) for (const t of ["click", "auxclick", "contextmenu"]) addEventListener(t, (e) => { const a = e.target.closest && e.target.closest('a[href^="/"]');
    const v = a && a.getAttribute("href"); if (v && /^\/(?:(?:events|packs|limited|about)\/|(?:decks|packs)\/[a-z0-9-]+\/)?$/.test(v)) a.setAttribute("href", H + v.slice(1)); }, true);
  addEventListener("click", (e) => { const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); location.hash = a.getAttribute("href"); }); })();</script>
