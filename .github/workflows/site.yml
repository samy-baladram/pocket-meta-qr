# Build the site from data/ and deploy it to GitHub Pages.
# Runs after each "Scrape tournaments" run, when the page or the build changes on main, and by hand.
name: Build and deploy site

on:
  workflow_run:
    workflows: ["Scrape tournaments"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - site/index.html
      - static/**
      - pipeline/build_db.py
      - pipeline/export.py
      - pipeline/window.py
      - pipeline/build.mjs
      - pipeline/common.mjs
      - pipeline/images.py
      - pipeline/qrcheck.mjs
      - pipeline/page.mjs
      - pipeline/images_i18n.py
      - preview/**
      - pipeline/i18n_names.mjs
      - i18n/**
      - package.json
      - package-lock.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: write   # R30: commits data/decks_seen.json (the deck pages' record)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # after a scrape run: the newest data commit

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install Pillow

      # Card, zoom, pack and energy images are made once and kept between runs.
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            site/c
            site/z
            site/p
            site/e
            site/i18n
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: Build database
        run: python pipeline/build_db.py --top 10

      - name: Export page input
        run: python pipeline/export.py

      - name: Build page data
        run: node pipeline/build.mjs

      # A missing image does not stop the deploy (the page shows 1 empty card); it is a warning in the run summary.
      - name: Make images
        run: python pipeline/images.py || echo "::warning title=Images::some card or energy images failed (see log)"

      # Nov 23 (card languages, /preview/ only): localized card images from the public "TCGPocket" Google Drive
      # (images_i18n.py sync: only the missing files, at most 6 min per run; the next runs go on). Kept in the
      # image cache (site/i18n). No GDRIVE_API_KEY secret = no images (the preview then shows English cards).
      # Never stops the deploy.
      - name: Localized card images
        continue-on-error: true
        timeout-minutes: 9
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          if [ -z "$GDRIVE_API_KEY" ]; then echo "::notice title=i18n images::no GDRIVE_API_KEY secret, skipped"; exit 0; fi
          # Nov 24: no localized pack art (images_i18n.py packs): every language page uses the English pack images (p/)
          rm -rf site/i18n/p
          python pipeline/images_i18n.py sync --key "$GDRIVE_API_KEY" --ids images.json --max-seconds 360 --langs ja,de,es,fr,it,ko,pt,zh   # ja, de first (the preview languages)

      - name: Check QR codes
        run: node pipeline/qrcheck.mjs

      - name: Assemble the site
        env:
          I18N_LIVE: "ja es pt de fr it ko"   # Phase 1 (Nov 23; es beta since Nov 23, pt and de since Nov 24, fr, it and ko since Nov 24): live language pages (space-separated); "" = off
          I18N_INDEX: "ja es pt de fr it"   # Phase 2 Steps 3 + 5 (Nov 24; all six indexable since Nov 24): indexable languages: no noindex, hreflang on both sides, in sitemap.xml; "" = none
          I18N_DECKS: "ja es pt de fr it"   # Phase 2 Step 4 (Nov 24): languages (in I18N_ROUTES) with deck pages /<l>/decks/<id>/; "" = none
          I18N_ROUTES: "ja es pt de fr it"   # Phase 2 Step 1 (Nov 24; all six since Nov 24): languages with section addresses (/ja/events/, /ja/packs/, /ja/limited/, /ja/about/; noindex); "" = off
        run: |
          rm -rf public && mkdir public
          mkdir -p site/v site/t && cp -r site/data.json site/packs.json site/search.json site/events.json site/more.json site/cards.json site/stats.json site/v site/t site/c site/z site/p site/e public/
          rm -f public/c/.width public/p/.width
          # Nov 23: test pages /preview/ (+ /preview/de/, /preview/ja/) = the live page + languages: preview/build.sh
          # (card images, names and texts; i18n/<lang>.json). Not linked, noindex, not in the sitemap.
          # Phase 1 (Nov 23): it also makes the live language pages listed in I18N_LIVE (/ja/: one page, noindex for now).
          # A problem here must never stop the live deploy: it is only a warning.
          if [ -f preview/build.sh ]; then
            bash preview/build.sh public || { rm -rf public/preview public/ja public/es public/pt public/de public/fr public/it public/ko; echo "::warning title=Languages::the /preview/ and /ja/ pages were not made (see log)"; }
          fi
          # Phase 1: the English pages get the language menu (preview/i18n_patch.py --menu-only), only when /ja/ was made;
          # else (or if the patch fails) the page as before. To turn the languages off: I18N_LIVE: "" below.
          SRC=site/index.html
          if [ -n "$I18N_LIVE" ] && [ -f public/ja/index.html ] && python preview/i18n_patch.py site/index.html site/index.menu.html --menu-only; then SRC=site/index.menu.html
          else echo "::notice title=Languages::English pages without the language menu"; fi
          # R30: shared app.<hash>.css/.js (the previous build's files kept from cache/app), deck pages + their record
          node pipeline/page.mjs "$SRC" public/index.html --prev cache/app --seen data/decks_seen.json --cards-seen data/cards_seen.json --alt "$I18N_INDEX" --alt-routes "$I18N_ROUTES" --alt-decks "$I18N_DECKS"
          # Static files from the UI chat (R7a): favicon, app icons, manifest, link preview image, robots.txt,
          # sitemap.xml. Served from the site root, next to index.html.
          find static -maxdepth 1 -type f ! -name README.md -exec cp --update=none {} public/ \;   # --update=none: keep page.mjs's sitemap.xml (R26)
          touch public/.nojekyll
          echo "files: $(find public -type f | wc -l), size: $(du -sh public | cut -f1)"

      # R30 §3: the record of each deck's last day in the data, so a deck that leaves keeps its page for 30 days.
      # page.mjs rewrites an entry only on a new day, so this commits about once a day. Pushes made with the workflow
      # token do not start other workflows.
      # R32: and data/cards_seen.json (the card pages' record, same rule).
      # continue-on-error: a problem here must never stop the deploy (the next run saves the record).
      - name: Save the deck record
        continue-on-error: true
        run: |
          f=$(ls data/decks_seen.json data/cards_seen.json 2>/dev/null || true); [ -n "$f" ] || { echo "No record yet."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $f
          if git diff --cached --quiet; then echo "Deck record unchanged."; exit 0; fi
          git commit -q -m "Data: deck / card record ($(date -u +%FT%TZ))"
          for i in 1 2 3; do
            if ! git pull -q --rebase origin main; then git rebase --abort || true; break; fi
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning title=Deck record::not saved this run (the next run saves it)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
